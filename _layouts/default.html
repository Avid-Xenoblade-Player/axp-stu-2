<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="preconnect" href="https://bunny.net" />
    <link href="https://bunny.net/css?family=atkinson-hyperlegible:400,400i,500,500i,700,700i" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="page-title">{{ page.title }}</div>
      
      {% if page.image %}
        <div class="panel-container">
          <img class="comic-panel" src="{{ page.image | relative_url }}" alt="Comic Panel">
        </div>
      {% endif %}

      <div class="narration">
        {{ content }}
      </div>
		
      {% if page.next_page_url %}
        <div class="command-container">
          <a class="command-link" href="{{ page.next_page_url | relative_url }}">{{ page.next_page_title }}</a>
        </div>
      {% endif %}
    </div>

    <!-- INPUT TERMINAL -->
    <div class="terminal-container">
      <h3 class="terminal-header">INPUT TERMINAL</h3>
      <iframe src="https://google.com"
        width="100%" 
        height="450" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0"
        class="terminal-iframe">
        Loading interface terminal...
      </iframe>
    </div>
  </body>
</html>
